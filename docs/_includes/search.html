<div id="doc-search" role="search">
  <input
    type="search"
    id="search-input"
    placeholder="Search the docs…"
    autocomplete="off"
    aria-label="Search the docs"
  />
  <ul id="search-results" aria-live="polite"></ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
<script>
  (function () {
    var input = document.getElementById("search-input");
    var results = document.getElementById("search-results");
    if (!input || !results || typeof lunr === "undefined") return;
    var index = null;
    var docs = [];
    fetch("{{ '/search-data.json' | relative_url }}")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        docs = data;
        index = lunr(function () {
          this.ref("url");
          this.field("title", { boost: 10 });
          this.field("content");
          data.forEach(function (d) { this.add(d); }, this);
        });
      })
      .catch(function () {});
    input.addEventListener("input", function () {
      var q = input.value.trim();
      results.innerHTML = "";
      if (!index || q.length < 2) return;
      var hits;
      try { hits = index.search(q + "*"); }
      catch (e) { hits = index.search(q); }
      hits.slice(0, 10).forEach(function (hit) {
        var doc = docs.filter(function (d) { return d.url === hit.ref; })[0];
        if (!doc) return;
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = doc.url;
        a.textContent = doc.title;
        li.appendChild(a);
        if (doc.excerpt) {
          var p = document.createElement("p");
          p.textContent = doc.excerpt;
          li.appendChild(p);
        }
        results.appendChild(li);
      });
      if (!hits.length) {
        var li = document.createElement("li");
        li.className = "search-empty";
        li.textContent = "No matches for \u201c" + q + "\u201d.";
        results.appendChild(li);
      }
    });
  })();
</script>
<style>
  #doc-search { margin: 0 0 1.75rem; }
  #doc-search input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.55rem 0.8rem;
    font-size: 1rem;
    color: inherit;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid #d0d5da;
    border-radius: 6px;
  }
  #search-results { list-style: none; margin: 0.5rem 0 0; padding: 0; }
  #search-results li { padding: 0.45rem 0; border-bottom: 1px solid #eceef1; }
  #search-results a { font-weight: 600; }
  #search-results p { margin: 0.15rem 0 0; color: #555; font-size: 0.9rem; }
  #search-results .search-empty { color: #777; font-size: 0.9rem; }
</style>

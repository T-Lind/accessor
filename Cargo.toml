[package]
name = "accessor"
version = "0.6.0"
edition = "2021"
description = "Local voice gateway for command-line agents"
license = "MIT"
default-run = "acc"

[[bin]]
name = "acc"
path = "src/main.rs"

[[bin]]
name = "accessor"
path = "src/legacy.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
cpal = "0.16"
earshot = "1.2.2"
rubato = "0.16"
transcribe-rs = { version = "=0.3.11", features = ["onnx"] }
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
hound = "3.5"
ratatui = "0.29"
crossterm = "0.28"
directories = "6"
dialoguer = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
pulldown-cmark = "0.13"
sonora = "=0.2.0"
tempfile = "3"
sha2 = "0.10"
argon2 = "0.5"
zeroize = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
lto = "thin"
strip = true

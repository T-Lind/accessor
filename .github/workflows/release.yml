name: Release

# Cut a release by pushing a version tag (for example `git tag v0.34.4 && git push origin v0.34.4`).
# Builds prebuilt acc binaries for Windows x64, Linux x64/arm64, and Apple Silicon macOS,
# packages them with checksums, and publishes them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libwayland-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libpipewire-0.3-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev pkg-config
      - name: Build
        run: cargo build --release --locked --bin acc --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="stage-${target}"
          mkdir -p "$stage"
          if [ -f "target/${target}/release/acc.exe" ]; then
            cp "target/${target}/release/acc.exe" "$stage/acc.exe"
          else
            cp "target/${target}/release/acc" "$stage/acc"
          fi
          cp LICENSE THIRD_PARTY.md "$stage/"
        env:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: acc-${{ matrix.target }}
          path: stage-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    # Only publish from a tag push. A manual workflow_dispatch may select a tag
    # as its ref, which would otherwise attach assets to a real release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zip
          version="${GITHUB_REF_NAME#v}"
          cd dist
          for dir in acc-*/; do
            target="${dir#acc-}"; target="${target%/}"
            if [ -f "$dir/acc.exe" ]; then
              (cd "$dir" && zip -q -r "../acc-${version}-${target}.zip" acc.exe LICENSE THIRD_PARTY.md)
            else
              (cd "$dir" && tar -czf "../acc-${version}-${target}.tar.gz" acc LICENSE THIRD_PARTY.md)
            fi
          done
          sha256sum acc-*.tar.gz acc-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/acc-*.tar.gz
            dist/acc-*.zip
            dist/SHA256SUMS
